services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fulfilment
      POSTGRES_USER: fulfilment
      POSTGRES_PASSWORD: fulfilment
    ports:
      - "5432:5432"
    volumes:
      - fulfilment-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fulfilment -d fulfilment"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fulfilment-postgres:
